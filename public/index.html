<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorldPixel</title>
<meta name="description" content="A world map colored in one pixel at a time. Pick your country and grow its flag.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 4'%3E%3Crect width='4' height='4' fill='%231a8cff'/%3E%3Crect x='1' y='1' width='2' height='1' fill='%23e8443a'/%3E%3Crect x='1' y='2' width='1' height='1' fill='%23ffd23f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<canvas id="map" aria-label="World map"></canvas>

<header class="bar">
  <div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="word">WorldPixel</span></div>
  <div class="bar-right" id="account"></div>
</header>

<aside class="board" id="board" hidden>
  <button class="board-head" id="boardToggle" aria-expanded="true">Countries <span class="online" id="online"></span></button>
  <ol id="boardList"></ol>
</aside>

<div class="hover" id="hover" hidden></div>

<div class="zoom">
  <button id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
  <button id="zoomOut" title="Zoom out" aria-label="Zoom out">&minus;</button>
  <button id="zoomHome" title="Whole world" aria-label="Whole world"><svg viewBox="0 0 20 20" width="16" height="16"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 10h14M10 3c-2.5 2-2.5 12 0 14M10 3c2.5 2 2.5 12 0 14" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
  <button id="zoomMine" title="Go to my country" aria-label="Go to my country" hidden><svg viewBox="0 0 20 20" width="16" height="16"><circle cx="10" cy="10" r="3" fill="currentColor"/><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
</div>

<div class="hint" id="hint" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="loading" id="loading">Loading the world…</div>

<dialog id="modal"><div class="modal-body" id="modalBody"></div></dialog>

<script src="/vendor/qrcode.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
